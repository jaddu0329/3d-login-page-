<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spline Viewer - 3D Character with Eye Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        #spline-container {
            width: 100%;
            height: 100%;
        }

        spline-viewer {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="spline-container">
        <!-- 
            Replace 'YOUR_SPLINE_SCENE_URL' with your actual Spline scene URL
            You can get this by:
            1. Creating your scene in Spline (spline.design)
            2. Exporting it or publishing it
            3. Getting the URL or using the .splinecode file
        -->
        <spline-viewer 
            url="https://my.spline.design/cutecomputerfollowcursor-Dhn9L5ECKgzqzhILzhWP29px/"
            events-target="global"
            events-types="mouse"
        ></spline-viewer>
    </div>

    <!-- Spline Viewer script -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.0/build/spline-viewer.js"></script>

    <script type="module">
        // Global mouse tracking for Spline events
        let mouseX = 0;
        let mouseY = 0;

        // Track mouse position globally
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX;
            mouseY = event.clientY;
            
            // Normalize to -1 to 1 range
            const normalizedX = (event.clientX / window.innerWidth) * 2 - 1;
            const normalizedY = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Dispatch custom event that Spline can listen to
            window.dispatchEvent(new CustomEvent('globalMouseMove', {
                detail: {
                    x: normalizedX,
                    y: normalizedY,
                    clientX: event.clientX,
                    clientY: event.clientY
                }
            }));
        });

        // Wait for Spline viewer to load
        const splineViewer = document.querySelector('spline-viewer');
        
        splineViewer.addEventListener('load', () => {
            console.log('Spline scene loaded');
            
            // Access Spline's runtime API
            const spline = splineViewer.spline;
            
            if (spline) {
                // Example: Access objects in your Spline scene
                // Replace 'LeftEye' and 'RightEye' with your actual object names
                const leftEye = spline.findObjectByName('LeftEye');
                const rightEye = spline.findObjectByName('RightEye');
                
                if (leftEye && rightEye) {
                    // Smooth eye tracking with damping
                    let targetRotationX = 0;
                    let targetRotationY = 0;
                    let currentRotationX = 0;
                    let currentRotationY = 0;
                    const damping = 0.15;
                    const maxRotation = 0.3;
                    
                    function updateEyeTracking() {
                        // Calculate look direction based on mouse position
                        const normalizedX = (mouseX / window.innerWidth) * 2 - 1;
                        const normalizedY = -(mouseY / window.innerHeight) * 2 + 1;
                        
                        // Calculate target rotation (limited)
                        targetRotationY = Math.max(-maxRotation, Math.min(maxRotation, normalizedX * maxRotation));
                        targetRotationX = Math.max(-maxRotation, Math.min(maxRotation, normalizedY * maxRotation));
                        
                        // Smooth interpolation
                        currentRotationX += (targetRotationX - currentRotationX) * damping;
                        currentRotationY += (targetRotationY - currentRotationY) * damping;
                        
                        // Apply rotation to eyes
                        if (leftEye && rightEye) {
                            leftEye.rotation.x = currentRotationX;
                            leftEye.rotation.y = currentRotationY;
                            rightEye.rotation.x = currentRotationX;
                            rightEye.rotation.y = currentRotationY;
                        }
                        
                        requestAnimationFrame(updateEyeTracking);
                    }
                    
                    updateEyeTracking();
                }
            }
        });
    </script>
</body>
</html>
